<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Habitat Journey Components</title>
<style>
:root{--canvas:#fafcfb;--card:#fff;--navy:#123047;--teal:#0c9f9a;--coral:#ff6b52;--yellow:#f4c84a;--green:#5daa68;--mist:#e8f5f4;--radius:20px;--button-height:52px;font-family:"Nunito Sans",system-ui,sans-serif;color:var(--navy)}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);padding:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;max-width:1000px;margin:auto}.hj-card{background:var(--card);border:1px solid #dce9e7;border-radius:var(--radius);padding:20px;box-shadow:0 8px 28px #12304712}.hj-button{min-height:var(--button-height);border:0;border-radius:12px;padding:0 20px;background:var(--teal);color:white;font:700 16px inherit}.hj-button:focus-visible{outline:3px solid var(--navy);outline-offset:3px}.macro{height:8px;background:#e7eeed;border-radius:99px;overflow:hidden}.macro span{display:block;width:62%;height:100%;background:var(--green)}.calorie-ring{width:160px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) 0 62%,#dceeed 62%)}.calorie-ring div{width:128px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;background:white}.quest-card{background:var(--mist)}
</style><main><h1>Component reference</h1><div class="grid">
<section class="hj-card"><h2>CalorieRing</h2><div class="calorie-ring" role="img" aria-label="1,240 calories left out of 2,000"><div><strong>1,240</strong><small>kcal left</small></div></div></section>
<section class="hj-card"><h2>MacroCard</h2><p>Protein <strong>72 / 120 g</strong></p><div class="macro" role="progressbar" aria-valuenow="72" aria-valuemin="0" aria-valuemax="120"><span></span></div></section>
<section class="hj-card quest-card"><h2>Daily quest</h2><p>Drink 2 liters of water</p><p><strong>1.2 / 2 L · +15 XP</strong></p></section>
<section class="hj-card"><h2>Controls</h2><button class="hj-button">Add to breakfast</button><p><label>Search foods <input type="search" autocomplete="off"></label></p></section>
</div></main></html>
