[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habitat-journey-api"
version = "0.9.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<1",
  "email-validator>=2.2,<3"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
