security:
  arbitrary_subprocess_adapters: prohibited
  artifact_path_escape: prohibited
  evidence_path_escape: prohibited
  immutable_evidence_checksums: required
  gate_approvals_are_gate_specific: true
  production_validations_are_evidence_derived: true
invalidation:
  dependency_graph: artifact-graph.json
  downstream_stale_propagation: required
  release_blocked_on_stale_artifacts: true
completion_states:
  design_language: gate_a_to_language
  design_system: gate_b_approved
  production_verified: production_verification_pass
  governed_release: governance_terminal
